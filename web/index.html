<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMessage Stats</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <input type="text" id="search" placeholder="Search...">
    <ul id="contact-list"></ul>
  </aside>

  <main class="content">
    <div id="welcome">
      <span>select a contact</span>
    </div>

    <header id="contact-header" class="header" style="display: none;">
      <h1 id="contact-name"></h1>
      <span class="since" id="texting-since"></span>
    </header>

    <div id="chart-container" style="display: none;">
      <section class="stats">
        <div class="stat-col">
          <p id="stat-total"></p>
          <p class="stat-detail" id="stat-total-detail"></p>
        </div>
        <div class="stat-col">
          <p id="stat-sent"></p>
          <p class="stat-detail" id="stat-sent-detail"></p>
        </div>
        <div class="stat-col">
          <p id="stat-received"></p>
          <p class="stat-detail" id="stat-received-detail"></p>
        </div>
      </section>

      <section class="patterns">
        <p id="convo-starter"></p>
        <p id="response-time"></p>
      </section>

      <section class="heatmap-section">
        <div class="section-header">
          <h2>when you text</h2>
          <span id="heatmap-peak"></span>
        </div>
        <div class="heatmap-wrapper">
          <div class="heatmap-days">
            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>
          </div>
          <div class="heatmap-grid">
            <canvas id="heatmap"></canvas>
            <div id="heatmap-tooltip"></div>
          </div>
        </div>
      </section>

      <section class="chart-section">
        <div class="section-header">
          <h2>messages over time</h2>
          <div class="toggle">
            <button data-view="year">Year</button>
            <button data-view="month" class="active">Month</button>
          </div>
        </div>
        <div class="chart-wrapper">
          <canvas id="chart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
