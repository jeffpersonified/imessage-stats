[project]
name = "imessage-stats"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "spacy>=3.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "anthropic>=0.18.0",
    "vaderSentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
